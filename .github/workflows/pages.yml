# Publishes site/ (the project page, made by Scripts/site/build.py) to GitHub Pages on every push to main that
# changes it: the folder becomes the only commit of the `gh-pages` branch, which Pages serves
# (Settings ▸ Pages ▸ Source: Deploy from a branch, gh-pages, / (root)).
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Push site/ to gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Project page from ${GITHUB_SHA::12}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
